# Included in nginx http context. No client IP, query string, referrer or user agent.
log_format weather_privacy '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name weather.micutu.com;
    access_log /var/log/nginx/weather-canary.access.log weather_privacy;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://weather.micutu.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weather.micutu.com;
    server_tokens off;
    access_log /var/log/nginx/weather-canary.access.log weather_privacy;
    error_log /var/log/nginx/weather-canary.error.log warn;
    ssl_certificate /etc/letsencrypt/live/weather.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weather.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:weather_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;

    # Trust restoration is configured globally in cloudflare-realip.conf.
    # Always overwrite visitor headers; the app trusts only loopback X-Real-IP.
    proxy_http_version 1.1;
    # nginx owns these headers, including its own error responses.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location /api/ {
        limit_req zone=weather_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8105;
    }
    # Node publishes an explicit asset allowlist and sets cache/security headers.
    # The former www copy is deliberately no longer a document root.
    location / { proxy_pass http://127.0.0.1:8105; }

    # No location-level add_header directives: preserve inheritance on every path.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
