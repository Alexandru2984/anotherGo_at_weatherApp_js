server {
    listen 80;
    listen [::]:80;
    server_name weather.micutu.com;


    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    access_log /var/log/nginx/weather-canary.access.log;
    error_log /var/log/nginx/weather-canary.error.log warn;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weather.micutu.com;


    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    root /srv/canary/weather.micutu.com/www;
    index index.html;

    access_log /var/log/nginx/weather-canary.access.log;
    error_log /var/log/nginx/weather-canary.error.log warn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/weather.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weather.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:weather_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /api/openweather/ {
        limit_req zone=weather_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8105;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal repository files are never public assets (before extension regex).
    location ~* ^/(?:README(?:\.md)?|server\.js|package(?:-lock)?\.json|(?:test|tests|deploy|docs|node_modules)(?:/|$)|scripts/smoke-test\.js) {
        return 404;
    }

    location ~* ^/sw(?:-v[0-9]+)?\.js$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff2?|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.micutu.com https://static.cloudflareinsights.com; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' https://openweathermap.org data:; connect-src 'self' https://analytics.micutu.com https://cloudflareinsights.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
}
